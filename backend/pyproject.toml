[project]
name = "ton-checkout"
version = "0.1.0"
description = "Non-custodial TON, USDT and Telegram Stars checkout: invoices, chain watcher, signed webhooks"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31",
    "alembic>=1.20",
    "asyncpg>=0.32",
    "fastapi[standard]>=0.149",
    "httpx>=0.28",
    "pydantic-settings>=2.16",
    "pyjwt>=2.10",
    "pynacl>=1.6",
    "pytoniq-core>=0.2.1",
    "redis>=8.1",
    "sqlalchemy[asyncio]>=2.1",
    "structlog>=26.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "respx>=0.23.1",
    "ruff>=0.17",
    "standardwebhooks>=1.1.0",
]
tools = [
    "tonutils>=2.5.1",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S", "PT"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["pytoniq_core", "pytoniq_core.*", "nacl.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
