name: ton-checkout

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    ENV: prod
    DATABASE_URL: postgresql+asyncpg://checkout:${POSTGRES_PASSWORD:-checkout}@db:5432/checkout
    REDIS_URL: redis://redis:6379/0
    SHOP_WEBHOOK_URL: http://api:8000/api/shop/webhook
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-checkout}
      POSTGRES_DB: checkout
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5452}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkout"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6395}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 10

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-5180}:80"
    restart: unless-stopped

volumes:
  pgdata:
