# Production override: the web container joins the network of an existing reverse proxy
# (Caddy, Traefik) instead of publishing a port on the host.
#
#   docker compose -f compose.yaml -f deploy/compose.prod.yaml up -d --build
#
# PROXY_NETWORK is the docker network your proxy container is attached to.
# TRUSTED_PROXY is the proxy's address (or that network's subnet): only requests from it may
# set the client IP through X-Forwarded-For.

services:
  web:
    ports: !reset []
    networks: [default, proxy]

  db:
    ports: !reset []

  redis:
    ports: !reset []

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true
